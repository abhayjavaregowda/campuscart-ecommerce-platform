spring.application.name=product-service
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ecommerce_products}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ecommerce_reviews}
spring.data.mongodb.auto-index-creation=true
server.port=8082
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
jwt.secret=${JWT_SECRET:EcommerceAuthJwtSecretKeyForDevelopment2026Secure123456}
app.seed-data=${SEED_DATA:true}
