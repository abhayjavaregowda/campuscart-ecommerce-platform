services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ecommerce_dev_password}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongodb:
    image: mongo:8.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  auth-service:
    build: ./auth-service
    environment:
      DB_URL: jdbc:mysql://mysql:3306/ecommerce_auth?allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ecommerce_dev_password}
      JWT_SECRET: ${JWT_SECRET:-EcommerceAuthJwtSecretKeyForDevelopment2026Secure123456}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy

  product-service:
    build: ./product-service
    environment:
      DB_URL: jdbc:mysql://mysql:3306/ecommerce_products?allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ecommerce_dev_password}
      SPRING_MONGODB_URI: mongodb://mongodb:27017/ecommerce_reviews
      JWT_SECRET: ${JWT_SECRET:-EcommerceAuthJwtSecretKeyForDevelopment2026Secure123456}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      SEED_DATA: "true"
    ports:
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  order-service:
    build: ./order-service
    environment:
      DB_URL: jdbc:mysql://mysql:3306/ecommerce_orders?allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ecommerce_dev_password}
      JWT_SECRET: ${JWT_SECRET:-EcommerceAuthJwtSecretKeyForDevelopment2026Secure123456}
      PRODUCT_SERVICE_URL: http://product-service:8082
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "8083:8083"
    depends_on:
      mysql:
        condition: service_healthy
      product-service:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_AUTH_API_URL: http://localhost:8081
        NEXT_PUBLIC_PRODUCT_API_URL: http://localhost:8082
        NEXT_PUBLIC_ORDER_API_URL: http://localhost:8083
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      - auth-service
      - product-service
      - order-service

volumes:
  mysql_data:
  mongo_data:
