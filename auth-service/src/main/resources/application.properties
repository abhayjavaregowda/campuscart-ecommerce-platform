spring.application.name=auth-service
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ecommerce_auth}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

server.port=8081
jwt.secret=${JWT_SECRET:EcommerceAuthJwtSecretKeyForDevelopment2026Secure123456}
jwt.expiration=${JWT_EXPIRATION:3600000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
